[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-trading-floor-market-content-engine"
version = "0.1.0"
description = "Automated market content engine for Alpha Trading Floor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.1",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.4",
  "httpx>=0.27.0",
  "websockets>=16.0.0",
  "pymysql>=1.1.1",
  "redis>=5.0.4",
  "exchange-calendars>=4.8.0",
  "tenacity>=8.3.0",
  "python-dotenv>=1.0.1",
  "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.6",
  "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["alpha_market_engine*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
